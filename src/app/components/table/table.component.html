<p-table [value]="tableData" styleClass="my-p-datatable">
  <ng-template pTemplate="header">
    <tr>
      <th>Título</th>
      <th>Data de geração</th>
      <th>Ações</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-row>
    <tr>
      <td>{{ row.title }}</td>
      <td>{{ row.date }}</td>
      <td>
        <component-button />
      </td>
    </tr>
  </ng-template>
</p-table>
